[project]
name = "dtach-bin"
version = "0.9.1"
description = "Precompiled dtach binary shipped as platform-specific Python wheels"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-only" }
authors = [{ name = "dev-aly3n", email = "66creation@gmail.com" }]
keywords = ["dtach", "terminal", "pty", "detach"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]

[project.urls]
Source    = "https://github.com/dev-aly3n/dtach-bin"
Issues    = "https://github.com/dev-aly3n/dtach-bin/issues"
Upstream  = "https://github.com/crigler/dtach"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dtach_bin"]

[tool.hatch.build.targets.wheel.shared-scripts]
"src/dtach_bin/_bin/dtach" = "dtach"
