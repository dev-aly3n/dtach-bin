name: build-wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    name: linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runs-on: ubuntu-latest }
          - { arch: aarch64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify upstream source checksum
        working-directory: vendor
        run: sha256sum -c dtach-0.9.tar.gz.sha256

      - name: Build dtach + wheel inside manylinux2014
        run: |
          docker run --rm -v "$(pwd):/work" -w /work \
            quay.io/pypa/manylinux2014_${{ matrix.arch }} \
            bash -exc '
              tar -xzf vendor/dtach-0.9.tar.gz -C /tmp
              cd /tmp/dtach-0.9
              ./configure
              make
              strip dtach 2>/dev/null || true
              cp dtach /work/src/dtach_bin/_bin/dtach
              chmod +x /work/src/dtach_bin/_bin/dtach
              PY=/opt/python/cp310-cp310/bin/python
              "$PY" -m pip install --quiet build wheel
              "$PY" -m build --wheel --outdir /work/wheelhouse /work
              cd /work/wheelhouse
              "$PY" -m wheel tags \
                --python-tag py3 \
                --abi-tag none \
                --platform-tag manylinux2014_${{ matrix.arch }} \
                --remove *.whl
              ls -la
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-macos:
    name: macos ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runs-on: macos-13 }
          - { arch: arm64,  runs-on: macos-14 }
    runs-on: ${{ matrix.runs-on }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Verify upstream source checksum
        working-directory: vendor
        run: shasum -a 256 -c dtach-0.9.tar.gz.sha256

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build dtach
        run: |
          set -ex
          tar -xzf vendor/dtach-0.9.tar.gz -C /tmp
          cd /tmp/dtach-0.9
          ./configure
          make
          strip dtach 2>/dev/null || true
          cp dtach "$GITHUB_WORKSPACE/src/dtach_bin/_bin/dtach"
          chmod +x "$GITHUB_WORKSPACE/src/dtach_bin/_bin/dtach"

      - name: Build wheel
        run: |
          set -ex
          python -m pip install --quiet build wheel
          python -m build --wheel
          cd dist
          python -m wheel tags \
            --python-tag py3 \
            --abi-tag none \
            --platform-tag macosx_11_0_${{ matrix.arch }} \
            --remove *.whl
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: dist/*.whl

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
